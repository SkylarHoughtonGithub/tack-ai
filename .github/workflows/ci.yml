name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: ruff lint
        run: uv run ruff check src/

      - name: ruff format
        run: uv run ruff format --check src/

      - name: mypy
        run: uv run mypy src/tack_ai/ --ignore-missing-imports

      - name: bandit security scan
        run: uv run bandit -r src/tack_ai/ -ll -x src/tack_ai/__pycache__

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: pytest
        run: uv run pytest tests/ -v --ignore=tests/e2e
        env:
          ANTHROPIC_API_KEY: "test-key-not-used"

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Start web server
        run: |
          uv run uvicorn tack_ai.web:app --port 8765 &
          sleep 3
        env:
          ANTHROPIC_API_KEY: "test-key-not-used"
          WEB_USERNAME: "admin"
          WEB_PASSWORD: "testpassword"

      - name: Run E2E tests
        run: uv run pytest tests/e2e/ -v
        env:
          BASE_URL: "http://localhost:8765"
          WEB_USERNAME: "admin"
          WEB_PASSWORD: "testpassword"
