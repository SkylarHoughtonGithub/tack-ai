services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_DB: tack_ai
      POSTGRES_USER: tack_ai
      POSTGRES_PASSWORD: tack_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tack_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  openfga:
    image: openfga/openfga:latest
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: memory
      OPENFGA_HTTP_ADDR: "0.0.0.0:8080"
    ports:
      - "8081:8080"   # HTTP API (8080 reserved for k3d)
      - "3000:3000"   # Playground UI
    healthcheck:
      test: ["CMD", "/usr/local/bin/openfga", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Phase 9 — Temporal dev server (comparison module).
  # Start with: docker compose up temporal temporal-ui
  temporal:
    image: temporalio/auto-setup:1.25
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=tack_ai
      - POSTGRES_PWD=tack_ai
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"   # gRPC frontend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "workflow", "list", "--address", "localhost:7233"]
      interval: 10s
      timeout: 5s
      retries: 10

  temporal-ui:
    image: temporalio/ui:2.31
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8088:8080"   # Temporal Web UI
    depends_on:
      - temporal

volumes:
  pgdata:
