[project]
name = "tack-ai"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "SkylarHoughtonGithub", email = "skylarhoughtongithub@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.130.0",
    "beautifulsoup4>=4.15.0",
    "logfire[pydantic-ai]>=5.1.1",
    "openfga-sdk>=0.10.5",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "mcp>=1.0.0",
    "pydantic-ai[dbos]>=0.8.1",
    "pydantic-evals>=2.52.0",
    "pydantic-settings>=2.11.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30.0",
    # Phase 9: durable execution
    "dbos>=2.10.0",
    "temporalio>=1.7.0",
    "langgraph>=1.2.12",
    "cedarpy>=4.12.1",
]

[project.scripts]
tack-ai = "tack_ai:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
