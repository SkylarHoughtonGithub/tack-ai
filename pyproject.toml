[project]
name = "tack-ai"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "SkylarHoughtonGithub", email = "skylarhoughtongithub@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.130.0",
    "typesafe-sdk",
    "bcrypt>=4.2.0",
    "beautifulsoup4>=4.15.0",
    "logfire[pydantic-ai]>=5.1.1",
    "openfga-sdk>=0.10.5",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "mcp>=1.0.0",
    "pydantic-ai[dbos]>=0.8.1",
    "pydantic-settings>=2.11.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30.0",
    "dbos>=2.10.0",
    "temporalio>=1.7.0",
    "cedarpy>=4.12.1",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "authlib>=1.3.0",
    "httpx>=0.27.0",
    # Observability — OpenTelemetry
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-psycopg>=0.48b0",
]

[project.scripts]
tack-ai = "tack_ai:main"
tack-ai-web = "tack_ai.web:main"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "bandit[toml]>=1.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "playwright>=1.49.0",
    "pytest-playwright>=0.6.0",
    "pydantic-evals>=2.52.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501", "B905"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["eval: LLM-as-judge evals (require API keys, cost money — run with: pytest -m eval)"]

[tool.bandit]
skips = ["B101"]  # allow assert in tests
