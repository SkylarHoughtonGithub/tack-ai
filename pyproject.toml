[project]
name = "tack-ai"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "SkylarHoughtonGithub", email = "skylarhoughtongithub@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.130.0",
    "logfire[pydantic-ai]>=5.1.1",
    "pydantic-ai>=0.8.1",
    "pydantic-evals>=2.52.0",
    "pydantic-settings>=2.11.0",
]

[project.scripts]
tack-ai = "tack_ai:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
