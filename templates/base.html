<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Tack-AI Console{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen font-mono text-gray-900">
  <nav class="bg-gray-900 text-gray-100 px-6 py-3 flex items-center justify-between">
    <div class="flex gap-6 items-center">
      <a href="/" class="font-bold text-white tracking-tight">tack-ai</a>
      {% if user %}
      <a href="/approvals" class="text-gray-400 hover:text-white text-sm transition-colors">approvals</a>
      <a href="/audit" class="text-gray-400 hover:text-white text-sm transition-colors">audit</a>
      <a href="/history" class="text-gray-400 hover:text-white text-sm transition-colors">history</a>
      {% if role == 'admin' %}
      <a href="/admin/users" class="text-gray-400 hover:text-white text-sm transition-colors">users</a>
      <a href="/admin/settings" class="text-gray-400 hover:text-white text-sm transition-colors">settings</a>
      {% endif %}
      <a href="/docs" class="text-gray-400 hover:text-white text-sm transition-colors">api</a>
      {% endif %}
    </div>
    {% if user %}
    <div class="text-sm text-gray-400 flex items-center gap-2">
      <span class="text-gray-300">{{ user }}</span>
      {% if role %}
      <span class="text-xs px-1.5 py-0.5 rounded
        {% if role == 'admin' %}bg-gray-700 text-gray-300{% else %}bg-gray-800 text-gray-500{% endif %}">
        {{ role }}
      </span>
      {% endif %}
      &nbsp;·&nbsp;
      <a href="/logout" class="hover:text-white transition-colors">logout</a>
    </div>
    {% endif %}
  </nav>
  <main class="max-w-5xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
