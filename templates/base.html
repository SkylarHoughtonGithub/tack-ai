<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Tack-AI Console{% endblock %}</title>
  <script>
    (function() {
      var t = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-page:   #0d0d0d;
      --bg-nav:    #000000;
      --bg-card:   #111111;
      --bg-input:  #1a1a1a;
      --bg-hover:  #161616;
      --border:    #222222;
      --border-sub:#1e1e1e;
      --border-in: #333333;
      --tx-1:      #f3f4f6;
      --tx-2:      #d1d5db;
      --tx-3:      #9ca3af;
      --tx-4:      #6b7280;
      --brand:     #4DCF1E;
      --brand-h:   #60E82A;
    }
    [data-theme="light"] {
      --bg-page:   #f8fafc;
      --bg-nav:    #ffffff;
      --bg-card:   #ffffff;
      --bg-input:  #ffffff;
      --bg-hover:  #f1f5f9;
      --border:    #e2e8f0;
      --border-sub:#e2e8f0;
      --border-in: #cbd5e1;
      --tx-1:      #0f172a;
      --tx-2:      #1e293b;
      --tx-3:      #475569;
      --tx-4:      #94a3b8;
      --brand:     #2da312;
      --brand-h:   #3aad15;
    }
    .brand-border-dim { border-color: color-mix(in srgb, var(--brand) 40%, transparent); }
    .oidc-btn:hover   { background-color: color-mix(in srgb, var(--brand) 10%, transparent); }
    *, *::before, *::after { transition: background-color 0.15s ease, border-color 0.15s ease, color 0.05s ease; }
  </style>
</head>
<body class="bg-[var(--bg-page)] min-h-screen font-mono text-[var(--tx-1)]">
  <nav class="bg-[var(--bg-nav)] border-b border-[var(--border-sub)] px-6 py-3 flex items-center justify-between">
    <div class="flex gap-6 items-center">
      <a href="/" class="flex items-center gap-2">
        <img id="nav-logo" src="/static/img/tack-ai-logo-dark.png" alt="Tack-AI" class="h-8 w-8 rounded">
        <span class="font-bold text-[var(--brand)] tracking-tight">tack-ai</span>
      </a>
      {% if user %}
      <a href="/approvals" class="text-[var(--tx-4)] hover:text-[var(--brand)] text-sm transition-colors">approvals</a>
      <a href="/audit"     class="text-[var(--tx-4)] hover:text-[var(--brand)] text-sm transition-colors">audit</a>
      <a href="/history"   class="text-[var(--tx-4)] hover:text-[var(--brand)] text-sm transition-colors">history</a>
      {% if role == 'admin' %}
      <a href="/admin/users"     class="text-[var(--tx-4)] hover:text-[var(--brand)] text-sm transition-colors">users</a>
      <a href="/admin/settings"  class="text-[var(--tx-4)] hover:text-[var(--brand)] text-sm transition-colors">settings</a>
      {% endif %}
      <a href="/docs" class="text-[var(--tx-4)] hover:text-[var(--brand)] text-sm transition-colors">api</a>
      {% endif %}
    </div>
    <div class="flex items-center gap-3">
      <button id="theme-toggle" onclick="toggleTheme()"
              class="text-[var(--tx-4)] hover:text-[var(--brand)] text-sm transition-colors select-none px-1"
              title="Toggle light / dark">
        <span id="theme-icon"></span>
      </button>
      {% if user %}
      <div class="text-sm text-[var(--tx-4)] flex items-center gap-2">
        <span class="text-[var(--tx-2)]">{{ user }}</span>
        {% if role %}
        <span class="text-xs px-1.5 py-0.5 rounded border brand-border-dim
          {% if role == 'admin' %}text-[var(--brand)]{% else %}border-[var(--border-in)] text-[var(--tx-4)]{% endif %}">
          {{ role }}
        </span>
        {% endif %}
        &nbsp;·&nbsp;
        <a href="/logout" class="hover:text-[var(--brand)] transition-colors">logout</a>
      </div>
      {% endif %}
    </div>
  </nav>
  <main class="max-w-5xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
  <script>
    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      document.getElementById('theme-icon').textContent = t === 'dark' ? '☀' : '☾';
      ['nav-logo', 'login-logo'].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.src = '/static/img/tack-ai-logo-' + t + '.png';
      });
    }
    function toggleTheme() {
      var next = (document.documentElement.getAttribute('data-theme') || 'dark') === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      applyTheme(next);
    }
    applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');
  </script>
</body>
</html>
