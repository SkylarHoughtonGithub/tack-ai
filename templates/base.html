<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Tack-AI Console{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen font-mono text-gray-900">
  <nav class="bg-gray-900 text-gray-100 px-6 py-3 flex items-center justify-between">
    <div class="flex gap-6 items-center">
      <a href="/" class="font-bold text-white tracking-tight">tack-ai</a>
      <a href="/approvals" class="text-gray-400 hover:text-white text-sm transition-colors">approvals</a>
      <a href="/audit" class="text-gray-400 hover:text-white text-sm transition-colors">audit</a>
    </div>
    {% if user %}
    <div class="text-sm text-gray-400">
      <span class="text-gray-300">{{ user }}</span>
      &nbsp;·&nbsp;
      <a href="/logout" class="hover:text-white transition-colors">logout</a>
    </div>
    {% endif %}
  </nav>
  <main class="max-w-5xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
