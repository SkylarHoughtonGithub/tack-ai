{% extends "base.html" %}
{% block title %}Login — Tack-AI{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-14">
  <div class="flex flex-col items-center mb-8">
    <img id="login-logo" src="/static/img/tack-ai-logo-dark.png" alt="Tack-AI" class="h-24 w-24 mb-3 rounded-lg">
    <h1 class="text-xl font-bold text-[var(--brand)] tracking-widest">TACK-AI</h1>
    <p class="text-xs text-[var(--tx-4)] mt-1">AI Agent Console</p>
  </div>

  {% if error %}
  <div class="bg-red-900/20 border border-red-800/60 text-red-400 rounded px-4 py-2 text-sm mb-4">
    {{ error }}
  </div>
  {% endif %}

  {% if oidc_enabled %}
  <a href="/auth/login"
     class="oidc-btn block w-full text-center border brand-border-dim rounded py-2 text-sm text-[var(--brand)] transition-colors mb-4">
    Sign in with {{ oidc_provider | capitalize }}
  </a>
  <div class="flex items-center gap-3 mb-4">
    <hr class="flex-1 border-[var(--border)]">
    <span class="text-xs text-[var(--tx-4)]">or</span>
    <hr class="flex-1 border-[var(--border)]">
  </div>
  {% endif %}

  <form method="post" action="/login" class="bg-[var(--bg-card)] rounded border border-[var(--border)] p-6 space-y-4">
    <div>
      <label class="block text-xs text-[var(--tx-4)] mb-1">Username</label>
      <input name="username" type="text" autofocus
             class="w-full bg-[var(--bg-input)] border border-[var(--border-in)] rounded px-3 py-2 text-sm text-[var(--tx-1)] focus:outline-none focus:ring-1 focus:ring-[var(--brand)] focus:border-[var(--brand)]">
    </div>
    <div>
      <label class="block text-xs text-[var(--tx-4)] mb-1">Password</label>
      <input name="password" type="password"
             class="w-full bg-[var(--bg-input)] border border-[var(--border-in)] rounded px-3 py-2 text-sm text-[var(--tx-1)] focus:outline-none focus:ring-1 focus:ring-[var(--brand)] focus:border-[var(--brand)]">
    </div>
    <button type="submit"
            class="w-full bg-[var(--brand)] text-black py-2 rounded text-sm font-bold hover:bg-[var(--brand-h)] transition-colors">
      Sign in
    </button>
  </form>
</div>
{% endblock %}
